name: Sitio (datos + despliegue)

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # cada 6 horas: baja datos de Basketball-Reference y republica
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas
        run: npm test

      # Si Basketball-Reference bloquea al servidor (HTTP 403) o falla, el paso no detiene el despliegue:
      # se publican los últimos datos guardados y el error queda en manifest.json (la app lo muestra).
      - name: Descargar datos de Basketball-Reference
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ ! -f site/data/manifest.json ]; then
            node scripts/fetch-data.mjs
          else
            echo "Push de código con datos existentes: no se consulta Basketball-Reference."
          fi

      - name: Recalcular modelo (backtesting)
        continue-on-error: true
        run: |
          if [ -f site/data/manifest.json ]; then node scripts/build-model.mjs; fi

      - name: Guardar datos en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore(data): actualizar datos de Basketball-Reference [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
